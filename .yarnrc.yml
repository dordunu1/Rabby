nodeLinker: node-modules

# Pin transitive @coinbase/wallet-sdk@beta to 3.8.0-beta.3 — the npm `beta` tag
# was removed (current dist-tags: canary, latest) which breaks fresh resolution
# of @rabby-wallet/eth-coinbase-keyring. The lockfile already maps both
# selectors to 3.8.0-beta.3.
packageExtensions:
  "@rabby-wallet/eth-coinbase-keyring@*":
    dependencies:
      "@coinbase/wallet-sdk": "3.8.0-beta.3"
